definitions:
  entities.Camera:
    properties:
      comment:
        type: string
      created_at:
        type: string
      fps:
        type: integer
      id:
        type: integer
      ip:
        type: string
      is_enabled:
        type: boolean
      port:
        type: integer
      stream_url:
        type: string
      updated_at:
        type: string
    type: object
  entities.CameraUpdate:
    properties:
      comment:
        type: string
      ip:
        minLength: 1
        type: string
      is_enabled:
        type: boolean
      port:
        maximum: 65535
        minimum: 1
        type: integer
      stream_url:
        type: string
    type: object
  entities.Event:
    properties:
      camera_id:
        type: integer
      confidence:
        type: number
      created_at:
        type: string
      embedding:
        items:
          type: number
        type: array
      object_id:
        type: integer
      photo_uuid:
        type: string
      type:
        type: string
      updated_at:
        type: string
      uuid:
        type: string
    required:
    - camera_id
    - embedding
    - object_id
    - photo_uuid
    - type
    type: object
  entities.Object:
    properties:
      created_at:
        type: string
      id:
        type: integer
      type:
        type: string
      updated_at:
        type: string
    required:
    - type
    type: object
