x-db-environment: &db-environment
  DB_HOST: db
  DB_PORT: ${POSTGRES_PORT}
  DB_NAME: ${POSTGRES_DB:?Fill POSTGRES_DB in .env}
  DB_USER: ${POSTGRES_USER:?Fill POSTGRES_USER in .env}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Fill POSTGRES_PASSWORD in .env}
  DB_SSLMODE: disable

services:
  db:
    image: pgvector/pgvector:pg17-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Fill POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Fill POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Fill POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - ${POSTGRES_DATA_FOLDER}:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 30
    restart: unless-stopped

  api_gateway:
    build:
      context: ./services/api_gateway
      dockerfile: Dockerfile
      target: runtime
    command: ["serve"]
    environment:
      <<: *db-environment
      LOGS_FILE_PATH: ${LOGS_FILE_PATH}
      URL_SERVER: 0.0.0.0:${API_PORT}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${API_PORT}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  logs_ds:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOST_LOGS_PATH}